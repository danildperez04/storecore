name: storecore

services:
  postgres:
    image: postgres:16-alpine
    container_name: storecore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-storecore}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-storecore}
      POSTGRES_DB: ${DATABASE_NAME:-storecore}
    ports:
      - '5432:5432'
    volumes:
      - storecore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-storecore} -d ${DATABASE_NAME:-storecore}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - storecore_net

volumes:
  storecore_pgdata:
    name: storecore_pgdata

networks:
  storecore_net:
    name: storecore_net
    driver: bridge
