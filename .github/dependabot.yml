version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      typeorm:
        patterns: ['typeorm', 'pg']
      testing:
        patterns: ['jest', 'ts-jest', 'supertest', '@types/jest', '@types/supertest']

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ['react', 'react-dom', 'react-router*']
      mui:
        patterns: ['@mui/*', '@emotion/*']
      testing:
        patterns: ['vitest', '@testing-library/*', 'jsdom']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      tooling:
        patterns: ['eslint', 'prettier', 'typescript*', '@commitlint/*', 'husky', 'lint-staged']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
