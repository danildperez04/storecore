name: storecore

services:
  postgres:
    image: postgres:16-alpine
    container_name: storecore-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - storecore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - storecore_net

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: storecore-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "node backend/dist/database/run-migrations.js && node backend/dist/main.js"
    networks:
      - storecore_net

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
    container_name: storecore-web
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - api
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - storecore_net

volumes:
  storecore_pgdata:
    name: storecore_pgdata

networks:
  storecore_net:
    name: storecore_net
    driver: bridge
